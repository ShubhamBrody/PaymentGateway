spring:
  datasource:
    url: ${DB_URL:jdbc:h2:file:./data/payment-system;LOCK_TIMEOUT=10000}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:30}
  jpa:
    hibernate:
      ddl-auto: update

app:
  security:
    jwt:
      secret: ${JWT_SECRET:${random.uuid}${random.uuid}}