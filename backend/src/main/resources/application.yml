spring:
  application:
    name: payment-system
  profiles:
    default: local
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s
      repositories:
        enabled: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
  jackson:
    deserialization:
      # Reject 10.5 for integer minor-unit amounts instead of silently truncating it to 10.
      accept-float-as-int: false
  mvc:
    problemdetails:
      enabled: true

server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

app:
  security:
    jwt:
      secret: ${JWT_SECRET:}
      issuer: ${JWT_ISSUER:payment-system}
      audience: ${JWT_AUDIENCE:payment-system-api}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:15m}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  processing:
    workers-enabled: ${PAYMENT_WORKERS_ENABLED:true}
    worker-count: ${PAYMENT_WORKER_COUNT:4}
    batch-size: 50
    idle-poll-interval: 50ms
    maintenance-interval: 1s
    # A message delivered to a worker but not acknowledged this long is taken over by another worker.
    reclaim-idle-timeout: 15s
    max-deliveries: 5
    requeue-after: 15s
    bank-reply-timeout: 8s
    max-bank-requests: 3
    status-ttl: 24h
    # A cached status that is not final is read again from the database after this long, in case Redis lost an update.
    status-recheck-after: 2s
    # After a Redis error, the API answers from the database for this long before it tries Redis again.
    redis-retry-after: 5s
  bank:
    simulator-enabled: ${BANK_SIMULATOR_ENABLED:true}
    # Customers pay from BANK01 to BANK30. Each bank answers at its own speed and declines its own share of RANDOM.
    banks: ${BANK_COUNT:30}
    approve-delay: 300ms
    slow-delay: 3s
    # How long a bank remembers a request, so a retry with the same key gets the same answer.
    memory-ttl: 24h